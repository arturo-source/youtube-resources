<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TechStore · 03 Evitar bloquear el renderizado</title>

  <!-- ✅ TIP 3: priorizar recursos críticos.
       preload de la fuente principal: se descubre ya en el HTML,
       sin esperar a que se descargue y parsee el CSS -->
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- ✅ modulepreload: evita la cascada main.js → products.js → config.js -->
  <link rel="modulepreload" href="/js/main.js">
  <link rel="modulepreload" href="/js/config.js">
  <link rel="modulepreload" href="/js/products.js">
  <link rel="modulepreload" href="/js/search.js">
  <link rel="modulepreload" href="/js/lib/lazy.js">

  <!-- ❌ Sigue siendo CSS que no usamos (lo quitamos en el tip 4) -->
  <link rel="stylesheet" href="/css/bootstrap.css">
  <!-- ✅ Sin @import en cadena: las hojas se descubren y descargan en paralelo -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">

  <!-- ✅ defer: se descarga en paralelo y se ejecuta tras parsear el HTML (respetando el orden) -->
  <script src="/vendor/lodash.js" defer></script>
  <!-- ✅ Script de terceros NO crítico: ni siquiera async es suficiente, porque al
       ejecutarse ocupa el hilo principal ~250 ms justo mientras la página carga.
       Lo pedimos cuando la página ya ha cargado y el navegador está libre. -->
  <script>
    addEventListener("load", () => {
      (window.requestIdleCallback || setTimeout)(() => {
        const script = document.createElement("script");
        script.src = "/js/analytics.js";
        document.head.append(script);
      });
    });
  </script>
  <!-- Los módulos ES (type="module") ya se comportan como defer por defecto -->
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Tech<span>Store</span></a>
    <label class="search">
      <img src="/icons/search.svg" alt="" class="icon">
      <input id="search" type="search" placeholder="Buscar productos…">
    </label>
    <nav class="actions">
      <a href="#" aria-label="Favoritos"><img src="/icons/heart.svg" alt="" class="icon"></a>
      <a href="#" aria-label="Cuenta"><img src="/icons/user.svg" alt="" class="icon"></a>
      <a href="#" aria-label="Carrito"><img src="/icons/cart.svg" alt="" class="icon"><span id="cart-count">0</span></a>
      <a href="#" aria-label="Menú" class="menu"><img src="/icons/menu.svg" alt="" class="icon"></a>
    </nav>
  </header>

  <p class="promo" id="promo"></p>

  <section class="hero">
    <!-- ✅ TIP 2: AVIF → WebP → JPG (el navegador elige el primero que soporte)
         ✅ srcset + sizes: descarga el tamaño adecuado para la pantalla
         ✅ width/height: el navegador reserva el hueco → sin saltos (CLS)
         ⚠️ El hero NO lleva loading="lazy": es la imagen LCP, debe cargar cuanto antes
         ✅ TIP 3: fetchpriority="high" → el navegador la pide antes que otras imágenes -->
    <picture>
      <source type="image/avif" sizes="100vw"
              srcset="/img/hero-800.avif 800w, /img/hero-1280.avif 1280w, /img/hero-1920.avif 1920w">
      <source type="image/webp" sizes="100vw"
              srcset="/img/hero-800.webp 800w, /img/hero-1280.webp 1280w, /img/hero-1920.webp 1920w">
      <img src="/img/hero-1280.jpg" sizes="100vw"
           srcset="/img/hero-800.jpg 800w, /img/hero-1280.jpg 1280w, /img/hero-1920.jpg 1920w"
           width="1920" height="1080" fetchpriority="high" alt="Nueva colección de tecnología">
    </picture>
    <div class="hero-text">
      <h1>La tecnología que te hace la vida más fácil</h1>
      <p>Descubre la nueva colección con envío en 24 horas.</p>
      <a class="btn btn-primary" href="#products">Ver productos</a>
    </div>
  </section>

  <main>
    <section id="products">
      <h2>Productos destacados</h2>
      <div class="grid" id="product-grid"><p class="loading">Cargando productos…</p></div>
    </section>

    <section id="stats">
      <h2>Ventas del año</h2>
      <canvas id="sales-chart" height="120"></canvas>
    </section>

    <section id="reviews">
      <h2>Lo que dicen nuestros clientes</h2>
      <button class="btn btn-outline-primary" id="open-reviews">Ver opiniones</button>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <button class="chat-bubble" id="chat-bubble" aria-label="Abrir chat">
    <img src="/icons/chat.svg" alt="" class="icon">
  </button>

  <dialog id="reviews-dialog">
    <button class="close" data-close aria-label="Cerrar"><img src="/icons/close.svg" alt="" class="icon"></button>
    <h3>Opiniones</h3>
    <ul id="reviews-list"></ul>
  </dialog>
</body>
</html>
