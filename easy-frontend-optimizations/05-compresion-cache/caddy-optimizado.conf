# ✅ TIP 5: compresión y caché con Caddy
# Este fragmento lo importan ./Caddyfile y el Caddyfile de la raíz del proyecto.

# 1) Compresión
#    - precompressed: si existe main.js.br (o .gz) y el navegador lo acepta,
#      Caddy lo sirve tal cual → Brotli nivel 11 sin gastar CPU por petición.
#    - encode: comprime al vuelo lo que no esté precomprimido (a partir de 512 bytes;
#      config.json es tan pequeño que ni se comprime).
#      Ojo: Caddy trae zstd y gzip de serie; Brotli al vuelo requiere un plugin,
#      por eso Brotli lo generamos en el build (build.mjs).
encode zstd gzip

file_server {
	precompressed br gzip
}

# 2) Caché del navegador (Cache-Control)

# Ficheros con hash en el nombre (main.3f9a1c2b.js): su contenido nunca cambia
# → cachearlos 1 año y no volver a preguntar al servidor (immutable).
@hashed path_regexp \.[0-9a-f]{8}\.[a-z0-9]+$
header @hashed Cache-Control "public, max-age=31536000, immutable"

# El HTML siempre se revalida: así el usuario recibe al instante las nuevas
# URLs con hash tras un despliegue (si no ha cambiado → 304 sin cuerpo).
@html path / /index.html
header @html Cache-Control "no-cache"

# Datos de la API: 1 minuto fresco, y hasta 10 min se puede servir la copia
# vieja mientras se revalida en segundo plano.
@api path /api/*
header @api Cache-Control "public, max-age=60, stale-while-revalidate=600"

# Imágenes de producto sin hash: 1 semana, luego se revalidan con ETag.
@productImages path /img/products/*
header @productImages Cache-Control "public, max-age=604800"
